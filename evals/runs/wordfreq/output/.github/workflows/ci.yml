name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Unit tests
        run: python3 -m unittest discover -v
      - name: Eval cases
        run: python3 evals/run.py
      - name: Install and smoke test
        run: |
          pip install .
          wordfreq examples/*.txt -n 3
